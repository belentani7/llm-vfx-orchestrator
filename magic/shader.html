<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BELENTANI // NEBULA SHADER · LLM VFX Orchestrator</title>
  <meta name="description" content="Experiencia WebGL procedimental del ecosistema Belentani con pausa automática y respeto a prefers-reduced-motion.">
  <meta name="theme-color" content="#05030a">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #05030a;
      --surface: rgba(11, 9, 20, 0.86);
      --border: rgba(245, 242, 235, 0.18);
      --text: #f5f2eb;
      --muted: #b8b4ac;
      --cyan: #4de8e0;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--sans); }
    a { color: var(--cyan); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
    .skip { position: absolute; left: -9999px; top: 12px; z-index: 80; padding: 10px 16px; border-radius: 8px; background: var(--cyan); color: #05030a; font-weight: 700; text-decoration: none; }
    .skip:focus { left: 16px; }
    header.site { position: relative; z-index: 20; border-bottom: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(12px); padding: .65rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .brand { color: var(--text); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
    nav.site { display: flex; gap: .4rem; flex-wrap: wrap; }
    nav.site a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 .75rem; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .88rem; }
    nav.site a:hover { color: var(--text); }
    main { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 3rem 1.5rem; }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .ui { position: relative; z-index: 2; max-width: 560px; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(12px); text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.03em; }
    .ui p { margin: 0 0 1.25rem; color: var(--muted); }
    .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    .cta { display: inline-flex; align-items: center; min-height: 44px; padding: .7rem 1.25rem; border-radius: 10px; font-weight: 700; text-decoration: none; background: var(--cyan); color: #05030a; border: 0; cursor: pointer; }
    .cta-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .sign { margin-top: 1.25rem; font: .76rem var(--mono); color: var(--muted); }
    footer.site { position: relative; z-index: 20; border-top: 1px solid var(--border); background: var(--surface); padding: 1rem 1.5rem; font-size: .85rem; color: var(--muted); text-align: center; }
    footer.site a { display: inline-flex; align-items: center; min-height: 44px; padding-inline: .35rem; text-decoration: none; }
  </style>
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="site">
    <a class="brand" href="../index.html">BELENTANI // NEBULA</a>
    <nav class="site" aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a href="../workspace.html">Workspace</a>
      <a href="../docs.html">Documentación</a>
      <a href="immersive.html">Immersive</a>
      <a href="sfx.html">Sound Forge</a>
    </nav>
  </header>

  <main id="contenido">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="ui">
      <h1>BELENTANI</h1>
      <p>Transporte de luz procedimental en GPU · Ecosistema creativo abierto</p>
      <div class="actions">
        <a class="cta" href="../workspace.html">Abrir Shot Workspace →</a>
        <button type="button" id="pause-shader" class="cta cta-ghost" aria-pressed="false">Pausar GPU</button>
      </div>
      <div class="sign">belentani.eu · noiacore.com</div>
    </div>
  </main>

  <footer class="site">
    <a href="../index.html">Inicio</a> · <a href="../accesibilidad.html">Accesibilidad</a> · <a href="../privacidad.html">Privacidad</a>
  </footer>

  <script type="module">
    import "../hero.js";
    (function () {
      if (typeof window.initHeroShader !== "function") return;
      var ctrl = window.initHeroShader("gl", { colorA: "#4de8e0", colorB: "#d4af37", colorC: "#ff073a", intensity: 0.95 });
      var btn = document.getElementById("pause-shader");
      if (!btn) return;
      var paused = false;
      btn.addEventListener("click", function () {
        paused = !paused;
        if (paused) { ctrl.pause(); btn.setAttribute("aria-pressed", "true"); btn.textContent = "Reanudar GPU"; }
        else { ctrl.resume(); btn.setAttribute("aria-pressed", "false"); btn.textContent = "Pausar GPU"; }
      });
    })();
  </script>
</body>
</html>
