  <style>
    :root {
      color-scheme: dark;
      --bg: #05030a;
      --surface: #0b0914;
      --card: #121020;
      --border: #292540;
      --text: #f5f2eb;
      --muted: #b8b4ac;
      --cyan: #4de8e0;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.65; }
    a { color: var(--cyan); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
    .skip { position: absolute; left: -9999px; top: 12px; z-index: 80; padding: 10px 16px; border-radius: 8px; background: var(--cyan); color: #05030a; font-weight: 700; text-decoration: none; }
    .skip:focus { left: 16px; }
    header.site { border-bottom: 1px solid var(--border); background: var(--surface); padding: .65rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .brand { color: var(--text); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
    nav.site { display: flex; gap: .4rem; flex-wrap: wrap; }
    nav.site a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 .75rem; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: .88rem; }
    nav.site a:hover { color: var(--text); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .box { max-width: 620px; width: 100%; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); background: var(--card); text-align: center; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.9rem, 4.5vw, 2.8rem); }
    .box p { margin: 0 0 1.5rem; color: var(--muted); }
    .grid-btns { display: flex; flex-wrap: wrap; gap: .65rem; justify-content: center; }
    button[data-s] { min-height: 44px; min-width: 44px; padding: .65rem 1.15rem; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
    button[data-s]:hover { border-color: var(--cyan); color: var(--cyan); }
    .sign { margin-top: 1.5rem; font: .76rem var(--mono); color: var(--muted); }
    footer.site { border-top: 1px solid var(--border); background: var(--surface); padding: 1rem 1.5rem; font-size: .85rem; color: var(--muted); text-align: center; }
    footer.site a { display: inline-flex; align-items: center; min-height: 44px; padding-inline: .35rem; text-decoration: none; }

<body>

  <main id="contenido">
    <div class="box">
      <h1>SOUND FORGE</h1>
      <p>Efectos sonoros procedimentales · Cero archivos externos, puro Web Audio</p>
      <div class="grid-btns">
        <button data-s="chime" type="button">Chime</button>

  </footer>

  <script>
    (function () {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = null;
      function ac() {
        if (!AC) return null;
        if (!ctx) ctx = new AC();
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }
      function tone(f, t0, dur, type, vol, slideTo) {
        var c = ac();
        if (!c) return;
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(f, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g).connect(c.destination);
        o.start(t0);
        o.stop(t0 + dur + 0.02);
      }
      function noise(t0, dur, vol, hp) {
        var c = ac();
        if (!c) return;
        var b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        var s = c.createBufferSource();
        s.buffer = b;
        var g = c.createGain(), flt = c.createBiquadFilter();
        flt.type = "highpass";
        flt.frequency.value = hp || 800;
        g.gain.setValueAtTime(vol || 0.15, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        s.connect(flt).connect(g).connect(c.destination);
        s.start(t0);
        s.stop(t0 + dur);
      }
      var sfx = {
        chime: function () { var c = ac(); if (!c) return; var t = c.currentTime; [523, 659, 784, 1046].forEach(function (f, i) { tone(f, t + i * 0.08, 0.9, "sine", 0.18); }); tone(2093, t, 1.2, "sine", 0.06); },
        whoosh: function () { var c = ac(); if (!c) return; var t = c.currentTime; noise(t, 0.7, 0.25, 400); tone(120, t, 0.7, "sawtooth", 0.12, 1400); },
        pop: function () { var c = ac(); if (!c) return; var t = c.currentTime; tone(900, t, 0.08, "sine", 0.3, 180); },
        ambient: function () { var c = ac(); if (!c) return; var t = c.currentTime; [110, 165, 220, 275].forEach(function (f) { tone(f, t, 4, "sine", 0.05); }); tone(55, t, 4, "triangle", 0.12); },
        power: function () { var c = ac(); if (!c) return; var t = c.currentTime; tone(60, t, 0.5, "sawtooth", 0.15, 240); tone(880, t + 0.35, 0.6, "sine", 0.12); },
        glitch: function () { var c = ac(); if (!c) return; var t = c.currentTime; [220, 180, 260, 150].forEach(function (f, i) { tone(f, t + i * 0.05, 0.05, "square", 0.12); }); noise(t, 0.3, 0.2, 1500); }
      };
      document.querySelectorAll("button[data-s]").forEach(function (b) {
        b.addEventListener("click", function () {
          var fn = sfx[b.getAttribute("data-s")];
          if (fn) fn();
        });
      });
    })();
  </script>
</body>
