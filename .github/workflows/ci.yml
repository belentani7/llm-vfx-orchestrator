name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (compilar, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compilar todo el codigo fuente
        run: python -m compileall -q .
      - name: Lint Python
        run: ruff check .
      - name: Tests
        run: pytest -q

  browser-workflow-inspector:
    name: Offline workflow JSON inspector / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate browser-side inspector without network dependencies
        run: node --test tests/web-workflow-validator.test.mjs
      - name: Check module syntax
        run: node --check docs/workflow-check.mjs
