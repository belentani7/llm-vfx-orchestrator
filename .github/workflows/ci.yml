name: VFX / Python pipeline validation

on:
  push:
    branches: [main, "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python ${{ matrix.python-version }} / tests and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual VFX package and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run complete pipeline regression suite
        run: python -m pytest -q tests
      - name: Ensure real CLI can start
        run: vfp --help
      - name: Verify source distribution/wheel can build
        run: |
          python -m pip install build
          python -m build --no-isolation

