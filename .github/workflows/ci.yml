name: VFX / Python pipeline validation

on:
  push:
    branches: [main, "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python ${{ matrix.python-version }} / tests and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual VFX package and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run complete pipeline regression suite
        run: python -m pytest -q tests
      - name: Ensure real CLI can start
        run: vfp --help
      - name: Verify source distribution/wheel can build
        run: |
          python -m pip install build hatchling
          python -m build --no-isolation


  web-app:
    name: Web UI / typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Export resolved lockfile for deterministic follow-up
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
