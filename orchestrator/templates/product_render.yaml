# Product Render Pipeline Template

comfyui:
  host: "127.0.0.1"
  port: 8188
  timeout: 300

llm:
  claude:
    model: "claude-sonnet-4-20250514"
    api_key: "${ANTHROPIC_API_KEY}"
  qwen:
    model: "qwen-vl-max"
    api_key: "${DASHSCOPE_API_KEY}"
  glm:
    model: "glm-4v-plus"
    api_key: "${ZHIPUAI_API_KEY}"

pipeline:
  max_retries: 2
  qa_threshold: 0.9

template:
  name: product_render
  default_loras:
    - name: "product_photo_v3"
      strength: 0.6
  default_sampler: "euler"
  default_steps: 25
  default_cfg: 7.0
  default_size:
    width: 1024
    height: 1024
  negative_prompt: "text, watermark, logo, blurry, low quality, unrealistic lighting"
